<pre><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-comment"># 電阻 (Ohm) 與電源 (V) 定義</span>
R1, R2, R3, R4, R5 = <span class="hljs-number">5</span>, <span class="hljs-number">10</span>, <span class="hljs-number">15</span>, <span class="hljs-number">20</span>, <span class="hljs-number">25</span>
V1, V2 = <span class="hljs-number">24</span>, <span class="hljs-number">12</span>

<span class="hljs-comment"># 網目方程式阻抗矩陣 A 與電壓矩陣 B</span>
A = np.array([
    [R1 + R2, -R2, <span class="hljs-number">0</span>],
    [-R2, R2 + R3 + R4, -R4],
    [<span class="hljs-number">0</span>, -R4, R4 + R5]
])
B = np.array([V1, <span class="hljs-number">0</span>, -V2])

<span class="hljs-comment"># 求解網目電流 [I1, I2, I3]</span>
I = np.linalg.solve(A, B)

<pre><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np
<span class="hljs-keyword">from</span> scipy.integrate <span class="hljs-keyword">import</span> solve_ivp

R, L, C, Vs = <span class="hljs-number">50.0</span>, <span class="hljs-number">0.1</span>, <span class="hljs-number">100e-6</span>, <span class="hljs-number">10.0</span> <span class="hljs-comment"># 元件參數</span>
RC = R * C

<span class="hljs-comment"># y[0] 為電容電壓 Vc, y[1] 為迴路電流 IL</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">rlc_ode</span>(<span class="hljs-params">t, y</span>):
    Vc, IL = y[<span class="hljs-number">0</span>], y[<span class="hljs-number">1</span>]
    <span class="hljs-keyword">return</span> [IL / C, (Vs - R * IL - Vc) / L]

initial_state = [<span class="hljs-number">0.0</span>, <span class="hljs-number">0.0</span>] <span class="hljs-comment"># 初始狀態無電壓、無電流</span>

<h1 id="82-%E8%A8%8A%E8%99%9F%E8%99%95%E7%90%86%E8%88%87%E9%A0%BB%E5%9F%9F%E5%88%86%E6%9E%90-signal-processing--fft">8.2 訊號處理與頻域分析 (Signal Processing &amp; FFT)</h1>
<ul>
<li data-marpit-fragment="1"><strong>時域 (Time Domain) vs 頻域 (Frequency Domain)</strong>：
<ul>
<li>時域訊號受高頻雜訊干擾時，肉眼難以直接看出其組成。</li>
<li>傅立葉變換將訊號在不同頻率的分量展開。</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>快速傅立葉變換 (FFT)</strong>：
<ul>
<li>使用 <code>numpy.fft.fft()</code> 進行數值快速傅立葉轉換。</li>
<li>可以完美擷取混雜了白雜訊中的特定頻率正弦波峰值。</li>
</ul>
</li>
</ul>

<h2 id="%E5%BF%AB%E9%80%9F%E5%82%85%E7%AB%8B%E8%91%89%E8%AE%8A%E6%8F%9B-fft-%E7%A8%8B%E5%BC%8F%E7%A2%BC">快速傅立葉變換 (FFT) 程式碼</h2>
<pre><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

sampling_rate = <span class="hljs-number">1000</span> <span class="hljs-comment"># 採樣率 1000Hz</span>
t = np.linspace(<span class="hljs-number">0</span>, <span class="hljs-number">1.0</span>, sampling_rate, endpoint=<span class="hljs-literal">False</span>)

<span class="hljs-comment"># 合成信號: 50Hz + 120Hz + 高斯白噪音</span>
noisy_signal = np.sin(<span class="hljs-number">2</span> * np.pi * <span class="hljs-number">50</span> * t) + <span class="hljs-number">0.5</span> * np.sin(<span class="hljs-number">2</span> * np.pi * <span class="hljs-number">120</span> * t) + np.random.normal(<span class="hljs-number">0</span>, <span class="hljs-number">1.5</span>, <span class="hljs-built_in">len</span>(t))

<span class="hljs-comment"># 快速傅立葉變換</span>
n = <span class="hljs-built_in">len</span>(t)
fft_result = np.fft.fft(noisy_signal)
fft_freq = np.fft.fftfreq(n, <span class="hljs-number">1</span> / sampling_rate)

<span class="hljs-comment"># 取正頻率部分與振幅大小</span>
half_n = n // <span class="hljs-number">2</span>
frequencies = fft_freq[:half_n]
amplitude = np.<span class="hljs-built_in">abs</span>(fft_result[:half_n]) * <span class="hljs-number">2</span> / n
</code></pre>

<h1 id="83-%E8%87%AA%E5%8B%95%E6%8E%A7%E5%88%B6%E8%88%87%E6%A9%9F%E6%A2%B0%E6%89%8B%E8%87%82%E9%81%8B%E5%8B%95%E5%AD%B8-control--robotics">8.3 自動控制與機械手臂運動學 (Control &amp; Robotics)</h1>
<ul>
<li data-marpit-fragment="1"><strong>自動控制與 PID 閉迴路系統</strong>：
<ul>
<li><strong>比例 (P)</strong>：與誤差成比例，提供基礎控制力。</li>
<li><strong>積分 (I)</strong>：累積歷史誤差，用以消除「穩態誤差」。</li>
<li><strong>微分 (D)</strong>：感應誤差變化率，抑制系統震盪。</li>
</ul>
</li>

<h2 id="%E5%AF%A6%E4%BD%9C%E7%89%A9%E4%BB%B6%E5%B0%8E%E5%90%91-pid-%E6%8E%A7%E5%88%B6%E5%99%A8">實作物件導向 PID 控制器</h2>
<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">PIDController</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, Kp, Ki, Kd, setpoint</span>):
        <span class="hljs-variable language_">self</span>.Kp, <span class="hljs-variable language_">self</span>.Ki, <span class="hljs-variable language_">self</span>.Kd = Kp, Ki, Kd
        <span class="hljs-variable language_">self</span>.setpoint = setpoint
        <span class="hljs-variable language_">self</span>.prev_error = <span class="hljs-number">0.0</span>
        <span class="hljs-variable language_">self</span>.integral = <span class="hljs-number">0.0</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">update</span>(<span class="hljs-params">self, current_value, dt</span>):
        error = <span class="hljs-variable language_">self</span>.setpoint - current_value
        
        <span class="hljs-comment"># P 項、I 項與 D 項計算</span>
        P_out = <span class="hljs-variable language_">self</span>.Kp * error
        <span class="hljs-variable language_">self</span>.integral += error * dt
        I_out = <span class="hljs-variable language_">self</span>.Ki * <span class="hljs-variable language_">self</span>.integral
        derivative = (error - <span class="hljs-variable language_">self</span>.prev_error) / dt <span class="hljs-keyword">if</span> dt &gt; <span class="hljs-number">0</span> <span class="hljs-keyword">else</span> <span class="hljs-number">0.0</span>
        D_out = <span class="hljs-variable language_">self</span>.Kd * derivative
        
        <span class="hljs-variable language_">self</span>.prev_error = error
        <span class="hljs-keyword">return</span> P_out + I_out + D_out

<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>若硬體發送序列埠資料的週期是 10ms，而 Python 每 100ms 才呼叫一次 <code>readline()</code>，且未配置 Flow Control。這會導致什麼後果？</strong></p>

<li data-marpit-fragment="1">
<p><strong>A.</strong> Python 程式運算效能會提高十倍</p>

</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 訊號在傳輸線上會被自動平均成低通濾波值</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> Python 直譯器會傳送指令強制降低晶片的發送頻率</p>
</div>

</ul>

<h1 id="85-%E7%B6%B2%E8%B7%AF%E9%80%9A%E8%A8%8A%E8%88%87-socket-%E7%A8%8B%E5%BC%8F-tcp-networking">8.5 網路通訊與 Socket 程式 (TCP Networking)</h1>
<ul>
<li data-marpit-fragment="1"><strong>TCP (Transmission Control Protocol)</strong>：
<ul>
<li>物聯網與網路最基礎之傳輸層協定。</li>
<li>提供可靠、有連線導向、雙向傳輸的串流服務。</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>Socket 機制與多連接埠</strong>：
<ul>
<li>Server 先進行 <code>bind()</code> 綁定與 <code>listen()</code> 監聽。</li>
<li>當新用戶端連線時，伺服器在 <code>accept()</code> 獲得新 Socket。</li>
<li>為了防止多個用戶端互相阻塞，必須為每一條連線開闢獨立的執行緒背景處理。</li>
</ul>
</li>
</ul>

<div class="ccq-columns">

<p><strong>在開發 TCP 伺服器時，常在 bind 之前加入以下配置：</strong></p>
<pre><code class="language-python">server_socket.setsockopt(socket.SOL_SOCKET, 
                         socket.SO_REUSEADDR, <span class="hljs-number">1</span>)

<p><strong>此設定的主要作用為何？</strong></p>
<ul>

</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 將傳輸協定強制提升為 UDP 封包形式</p>

<h2 id="ccq-5---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 5 - 答案與解析</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-%E5%85%81%E8%A8%B1%E4%BC%BA%E6%9C%8D%E5%99%A8%E9%97%9C%E9%96%89%E9%87%8D%E5%95%9F%E5%BE%8C%E7%AB%8B%E5%8D%B3%E9%87%8D%E6%96%B0-bind-%E5%8E%9F%E5%9F%A0%E8%99%9F%E5%85%8D%E5%8F%97-time_wait-%E4%BF%9D%E7%95%99%E6%9C%9F%E9%99%90%E5%88%B6"><strong>正確答案：C. 允許伺服器關閉重啟後，立即重新 bind 原埠號，免受 TIME_WAIT 保留期限制</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li>TCP 連線終止後，連接埠會在作業系統內部保留在 TIME_WAIT 狀態數分鐘，防堵網路殘存封包。</li>
<li>此時重新 bind 同一埠號會拋出 Address already in use 錯誤。</li>
<li>配置 <code>SO_REUSEADDR</code> 能允許重用埠號，大幅方便程式除錯，故選 C。</li>
</ul>
</div>

</div>
</li>
</ul>
