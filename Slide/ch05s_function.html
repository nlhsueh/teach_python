<h2 id="%E6%9C%AC%E7%AB%A0%E5%AD%B8%E7%BF%92%E9%87%8D%E9%BB%9E">本章學習重點</h2>
<ul>
<li data-marpit-fragment="1"><strong>5.1 模組化設計與函式基本定義 (Modular Design)</strong>
<ul>
<li>函式定義、引數傳遞、回傳值、Keyword 參數、預設值</li>
<li>限制參數傳遞機制 (<code>/</code> 與 <code>*</code>)、現代型態提示 (Type Hints)</li>
<li>可變動引數個數 (<code>*args</code>、<code>**kwargs</code>)</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>5.2 進階參數的傳遞 (Parameter Passing)</strong>
<ul>
<li>不可變物件 vs 可變物件傳遞、複製後傳 (Copy and pass)</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>5.3 Lambda 匿名函式 (Lambda)</strong>
<ul>
<li>Lambda 宣告、客製化排序應用</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>5.4 例外處理 (Exception)</strong>
<ul>
<li>try-except-else-finally 結構、主動 raise 例外</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>5.5 套件與應用 (Packages &amp; Application)</strong>
<ul>
<li>套件結構與 import，河內塔、井字棋、YouTube 下載範例</li>
</ul>
</li>
</ul>

hello2(<span class="hljs-string">&quot;Python&quot;</span>)  <span class="hljs-comment"># 輸出: Hello Python</span>
</code></pre>

        <span class="hljs-keyword">if</span> (a &gt; c):
            m = a
        <span class="hljs-keyword">else</span>:
            m = c
    <span class="hljs-keyword">elif</span> (b &gt; c):
        m = b
    <span class="hljs-keyword">else</span>:

    <span class="hljs-keyword">return</span> m    <span class="hljs-comment"># 回傳最大值</span>

<h2 id="515-%E9%97%9C%E9%8D%B5%E5%AD%97%E5%BC%95%E6%95%B8-keyword-arguments">5.1.5 關鍵字引數 (Keyword Arguments)</h2>
<ul>
<li data-marpit-fragment="1">呼叫函式時，預設是依據位置順序傳遞。但也可利用關鍵字指定，不受順序限制：</li>
</ul>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">hello1</span>(<span class="hljs-params">name, msg</span>):
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Hi, {}, {}&quot;</span>.<span class="hljs-built_in">format</span>(name, msg))

<span class="hljs-comment"># 1. 依位置傳遞</span>
hello1(<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;Good morning&#x27;</span>)

<span class="hljs-comment"># 2. 依關鍵字傳遞 (指名 keyword=value)</span>
hello1(msg=<span class="hljs-string">&#x27;Good morning&#x27;</span>, name=<span class="hljs-string">&#x27;Nick&#x27;</span>)

<span class="hljs-comment"># 3. 順序相反但未指名 (將會印出 Hi, Good morning, Nick - 語意錯誤)</span>
hello1(<span class="hljs-string">&#x27;Good morning&#x27;</span>, <span class="hljs-string">&#x27;Nick&#x27;</span>)
</code></pre>

<h2 id="517-%E4%BD%8D%E7%BD%AE%E5%B0%88%E7%94%A8%E8%88%87%E9%97%9C%E9%8D%B5%E5%AD%97%E5%B0%88%E7%94%A8%E5%8F%83%E6%95%B8-python-38">5.1.7 位置專用與關鍵字專用參數 (Python 3.8+)</h2>
<ul>
<li data-marpit-fragment="1">透過 <code>/</code> 和 <code>*</code> 來精準控制引數的傳遞方式：
<ul>
<li><strong><code>/</code> 之前的參數</strong>：必須為<strong>位置引數</strong> (不能用 name=val 指定)。</li>
<li><strong><code>*</code> 之後的參數</strong>：必須為<strong>關鍵字引數</strong> (不能用位置指定)。</li>
</ul>
</li>
</ul>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">example</span>(<span class="hljs-params">pos_only, /, standard, *, kw_only</span>):
    <span class="hljs-built_in">print</span>(pos_only, standard, kw_only)

example(<span class="hljs-string">&quot;pos&quot;</span>, <span class="hljs-string">&quot;standard&quot;</span>, kw_only=<span class="hljs-string">&quot;kw&quot;</span>) <span class="hljs-comment"># 正確</span>

<span class="hljs-comment"># example(pos_only=&quot;pos&quot;, standard=&quot;std&quot;, kw_only=&quot;kw&quot;) # ERROR: pos_only 不能指名</span>
<span class="hljs-comment"># example(&quot;pos&quot;, &quot;standard&quot;, &quot;kw&quot;)                      # ERROR: kw_only 必須指名</span>
</code></pre>

<h2 id="519-%E5%8F%AF%E8%AE%8A%E5%8B%95%E7%9A%84%E5%8F%83%E6%95%B8%E5%80%8B%E6%95%B8">5.1.9 可變動的參數個數</h2>
<ul>
<li data-marpit-fragment="1">當傳入的參數數量不確定時：
<ul>
<li><strong><code>*args</code></strong> (變動位置參數)：以 <strong>Tuple</strong> 形式收集多個位置引數。</li>
<li><strong><code>**kwargs</code></strong> (變動關鍵字參數)：以 <strong>Dict</strong> 形式收集多個關鍵字引數。</li>
</ul>
</li>
</ul>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">avg</span>(<span class="hljs-params">name, *grade</span>): <span class="hljs-comment"># grade 收集為 tuple</span>
    total = <span class="hljs-built_in">sum</span>(grade)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Student: <span class="hljs-subst">{name}</span>, Avg: <span class="hljs-subst">{total / <span class="hljs-built_in">len</span>(grade) <span class="hljs-keyword">if</span> grade <span class="hljs-keyword">else</span> <span class="hljs-number">0</span>}</span>&quot;</span>)

avg(<span class="hljs-string">&quot;Nick&quot;</span>, <span class="hljs-number">90</span>, <span class="hljs-number">80</span>, <span class="hljs-number">100</span>) <span class="hljs-comment"># grade 為 (90, 80, 100)</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">intro</span>(<span class="hljs-params">name, **kwargs</span>): <span class="hljs-comment"># kwargs 收集為 dict</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Name: <span class="hljs-subst">{name}</span>, Detail: <span class="hljs-subst">{kwargs}</span>&quot;</span>)

intro(<span class="hljs-string">&quot;Albert&quot;</span>, age=<span class="hljs-number">20</span>, city=<span class="hljs-string">&quot;Taichung&quot;</span>) <span class="hljs-comment"># kwargs 為 {&#x27;age&#x27;: 20, &#x27;city&#x27;: &#x27;Taichung&#x27;}</span>
</code></pre>

<header>Python 程式設計 | 第五章：函式設計與模組化</header>
<h2 id="ccq-1---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 1 - 答案與解析</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-funcb20-30"><strong>正確答案：C. <code>func(b=20, 30)</code></strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">Python 的引數傳遞語法嚴格規定：<strong>位置引數（Positional Arguments）必須排在關鍵字引數（Keyword Arguments）之前</strong>。</li>
<li data-marpit-fragment="3">在選項 C <code>func(b=20, 30)</code> 中，第一個引數 <code>b=20</code> 為關鍵字引數，而第二個 <code>30</code> 為位置引數，這直接違反了語法規則，會拋出 <code>SyntaxError: positional argument follows keyword argument</code>。</li>
<li data-marpit-fragment="4">其他選項皆為合法呼叫。</li>
</ul>
</div>
<div class="ccq-logo">
  <img src="../img/ch01/answer_icon.svg" alt="Answer" />
</div>
</li>
</ul>

<h2 id="ccq-2---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 2 - 答案與解析</h2>
<div class="ccq-columns">

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-5-5-10"><strong>正確答案：C. <code>5 [5, 10]</code></strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>x = 5</code> 為整數（不可變物件），傳入後 <code>a = a + 10</code> 在局部作用域建立新物件並重綁局部變數 <code>a</code>，<strong>不影響</strong>外部 <code>x</code> 的值。故 <code>x</code> 依然為 <code>5</code>。</li>
<li data-marpit-fragment="3"><code>y = [5]</code> 為串列（可變物件），傳入後 <code>b.append(10)</code> 是在原本的串列位址上就地進行修改，因此外部的 <code>y</code> 內容會被同步更改為 <code>[5, 10]</code>。</li>
</ul>

</div>
</li>

<header>Python 程式設計 | 第五章：函式設計與模組化</header>
<h2 id="531-lambda-%E5%8C%BF%E5%90%8D%E5%87%BD%E5%BC%8F%E5%9F%BA%E6%9C%AC%E8%AA%9E%E6%B3%95">5.3.1 Lambda 匿名函式基本語法</h2>
<ul>
<li data-marpit-fragment="1"><code>lambda</code> 常用來建立一次性、簡單的迷你功能。其結構為：<code>lambda 參數: 運算表達式</code>。</li>
<li data-marpit-fragment="2">表達式會自動被回傳，不需要（也不能）寫 <code>return</code>。</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># 宣告一個簡單的加法 lambda</span>
add = <span class="hljs-keyword">lambda</span> x, y: x + y
<span class="hljs-built_in">print</span>(add(<span class="hljs-number">5</span>, <span class="hljs-number">3</span>)) <span class="hljs-comment"># 8</span>

<span class="hljs-comment"># 與 map, filter 搭配使用</span>
nums = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>]
squared = <span class="hljs-built_in">list</span>(<span class="hljs-built_in">map</span>(<span class="hljs-keyword">lambda</span> x: x**<span class="hljs-number">2</span>, nums))
<span class="hljs-built_in">print</span>(squared) <span class="hljs-comment"># [1, 4, 9, 16]</span>
</code></pre>

<header>Python 程式設計 | 第五章：函式設計與模組化</header>
<h2 id="532-lambda-%E6%96%BC%E6%8E%92%E5%BA%8F%E7%9A%84%E5%AE%A2%E8%A3%BD%E5%8C%96%E6%87%89%E7%94%A8">5.3.2 Lambda 於排序的客製化應用</h2>
<ul>
<li data-marpit-fragment="1">透過 <code>key=lambda</code>，我們可以指定複雜容器的比較指標。</li>
<li data-marpit-fragment="2">範例：依據二維成績列表中「物理（最後一個欄位）」或「加權分數」進行排序。</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># [英文, 數學, 物理]</span>
grades = [[<span class="hljs-number">12</span>, <span class="hljs-number">23</span>, <span class="hljs-number">43</span>], [<span class="hljs-number">9</span>, <span class="hljs-number">4</span>, <span class="hljs-number">10</span>], [<span class="hljs-number">100</span>, <span class="hljs-number">22</span>, <span class="hljs-number">1</span>]]

<span class="hljs-comment"># 依據物理成績排序 (比較 43, 10, 1)</span>
g1 = <span class="hljs-built_in">sorted</span>(grades, key=<span class="hljs-keyword">lambda</span> x: x[-<span class="hljs-number">1</span>])
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;依物理排序:&quot;</span>, g1) <span class="hljs-comment"># [ [100,22,1], [9,4,10], [12,23,43] ]</span>

<span class="hljs-comment"># 依據加權總分 (英文*0.3 + 數學*0.4 + 物理*0.4) 排序</span>
g2 = <span class="hljs-built_in">sorted</span>(grades, key=<span class="hljs-keyword">lambda</span> x: x[<span class="hljs-number">0</span>]*<span class="hljs-number">0.3</span> + x[<span class="hljs-number">1</span>]*<span class="hljs-number">0.4</span> + x[<span class="hljs-number">2</span>]*<span class="hljs-number">0.4</span>)
</code></pre>

<li data-marpit-fragment="1">

<li data-marpit-fragment="4">最後透過 <code>list()</code> 轉為串列輸出，結果為 <code>[4, 16]</code>。</li>
</ul>

<h2 id="541-%E4%BB%80%E9%BA%BC%E6%98%AF%E4%BE%8B%E5%A4%96%E8%99%95%E7%90%86">5.4.1 什麼是例外處理？</h2>
<ul>
<li data-marpit-fragment="1">在程式執行時，難免會遇到不預期的錯誤（如使用者輸入非數字、檔案開檔失敗）。</li>
<li data-marpit-fragment="2">若不妥善處理，程式會直接崩潰中斷。</li>
<li data-marpit-fragment="3">Python 使用 <strong><code>try-except-else-finally</code></strong> 結構來攔截並安全處理例外。</li>
</ul>
<pre><code class="language-python"><span class="hljs-keyword">try</span>:
    <span class="hljs-comment"># 可能引發異常的程式碼</span>
    num = <span class="hljs-built_in">int</span>(<span class="hljs-built_in">input</span>(<span class="hljs-string">&quot;請輸入一個數字: &quot;</span>))
    result = <span class="hljs-number">10</span> / num
<span class="hljs-keyword">except</span> ValueError:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;輸入格式錯誤，請輸入整數！&quot;</span>)
<span class="hljs-keyword">except</span> ZeroDivisionError:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;除數不能為 0！&quot;</span>)
</code></pre>

<ul>
<li data-marpit-fragment="1"><strong><code>else</code> 區塊</strong>：在沒有發生任何例外時執行。</li>

</ul>
<pre><code class="language-python"><span class="hljs-keyword">try</span>:
    f = <span class="hljs-built_in">open</span>(<span class="hljs-string">&#x27;data/non_existent.txt&#x27;</span>, <span class="hljs-string">&#x27;r&#x27;</span>)
    line = f.readline()
<span class="hljs-keyword">except</span> FileNotFoundError:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;找不到指定的檔案！&quot;</span>)
<span class="hljs-keyword">else</span>:
    <span class="hljs-built_in">print</span>(line)
    f.close()
<span class="hljs-keyword">finally</span>:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;檔案流程處理結束。&quot;</span>)
</code></pre>

<h2 id="543-%E4%B8%BB%E5%8B%95%E6%8B%8B%E5%87%BA%E4%BE%8B%E5%A4%96-raise">5.4.3 主動拋出例外 (raise)</h2>
<ul>
<li data-marpit-fragment="1">當程式偵測到不合邏輯的業務狀態（例如年齡小於 0 歲）時，可使用 <code>raise</code> 主動引發錯誤，交由上層補獲處理。</li>
</ul>
<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">set_age</span>(<span class="hljs-params">age</span>):
    <span class="hljs-keyword">if</span> age &lt; <span class="hljs-number">0</span> <span class="hljs-keyword">or</span> age &gt; <span class="hljs-number">150</span>:
        <span class="hljs-comment"># 主動拋出值錯誤例外</span>
        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;年齡必須介於 0 至 150 之間！&quot;</span>)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;年齡設定成功：<span class="hljs-subst">{age}</span>&quot;</span>)

<span class="hljs-keyword">try</span>:
    set_age(-<span class="hljs-number">5</span>)
<span class="hljs-keyword">except</span> ValueError <span class="hljs-keyword">as</span> e:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;補獲錯誤:&quot;</span>, e) <span class="hljs-comment"># 輸出: 補獲錯誤: 年齡必須介於 0 至 150 之間！</span>
</code></pre>

<h2 id="ccq-4---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 4 - 答案與解析</h2>

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-always-executed"><strong>正確答案：C. <code>Always executed</code></strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">在 Python 例外處理中，<code>finally</code> 區塊必定會執行。</li>
<li data-marpit-fragment="3"><strong>關鍵規則</strong>：如果 <code>finally</code> 區塊中包含了 <code>return</code> 語句，它會直接<strong>覆蓋 (override)</strong> try 區塊或 except 區塊中已準備返回的任何值。</li>
<li data-marpit-fragment="4">呼叫 <code>test_div(10, 2)</code> 時，try 內計算得 <code>5.0</code> 並準備 return，隨後進入 <code>finally</code> 執行了 <code>return &quot;Always executed&quot;</code>，覆蓋了原本的 <code>5.0</code>。</li>
</ul>

<ul>
<li data-marpit-fragment="1"><strong>套件 (Package)</strong>：是一個包含一個特殊檔案 <code>__init__.py</code> 的資料夾目錄，可以包含多個子模組 (modules)。</li>
<li data-marpit-fragment="2"><strong>常用的 import 語法</strong>：</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># 1. 匯入整個套件模組</span>
<span class="hljs-keyword">import</span> time
<span class="hljs-built_in">print</span>(time.time())

<span class="hljs-comment"># 2. 僅匯入模組內特定函數 (呼叫時不用加模組名稱字首)</span>

<span class="hljs-comment"># 3. 給予別名簡化呼叫</span>
<span class="hljs-keyword">import</span> json <span class="hljs-keyword">as</span> js

<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">hanoi</span>(<span class="hljs-params">n, start, temp, end</span>):

    <span class="hljs-keyword">else</span>:
        <span class="hljs-comment"># 1. 將上面 n-1 個盤子從起始柱搬到輔助柱</span>

        <span class="hljs-comment"># 2. 將底層第 n 個盤子從起始柱搬到目標柱</span>

        <span class="hljs-comment"># 3. 將輔助柱上的 n-1 個盤子搬到目標柱</span>
        hanoi(n - <span class="hljs-number">1</span>, temp, start, end)

<h2 id="553-%E6%87%89%E7%94%A8%E4%BA%95%E5%AD%97%E6%A3%8B%E7%8B%80%E6%85%8B%E8%88%87%E5%8B%9D%E8%B2%A0%E5%88%A4%E5%AE%9A">5.5.3 應用：井字棋狀態與勝負判定</h2>
<ul>
<li data-marpit-fragment="1">使用 9 元素的一維串列表示井字棋格盤狀態。</li>
<li data-marpit-fragment="2">呼叫函式判定落子位置與連線獲勝：</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># 初始化棋盤</span>
board = [<span class="hljs-built_in">str</span>(i) <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">1</span>, <span class="hljs-number">10</span>)]

<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_win</span>(<span class="hljs-params">player</span>):
    <span class="hljs-comment"># 八種勝負連線情況</span>
    win_cond = [
        [<span class="hljs-number">0</span>,<span class="hljs-number">1</span>,<span class="hljs-number">2</span>], [<span class="hljs-number">3</span>,<span class="hljs-number">4</span>,<span class="hljs-number">5</span>], [<span class="hljs-number">6</span>,<span class="hljs-number">7</span>,<span class="hljs-number">8</span>], <span class="hljs-comment"># 橫</span>
        [<span class="hljs-number">0</span>,<span class="hljs-number">3</span>,<span class="hljs-number">6</span>], [<span class="hljs-number">1</span>,<span class="hljs-number">4</span>,<span class="hljs-number">7</span>], [<span class="hljs-number">2</span>,<span class="hljs-number">5</span>,<span class="hljs-number">8</span>], <span class="hljs-comment"># 直</span>
        [<span class="hljs-number">0</span>,<span class="hljs-number">4</span>,<span class="hljs-number">8</span>], [<span class="hljs-number">2</span>,<span class="hljs-number">4</span>,<span class="hljs-number">6</span>]           <span class="hljs-comment"># 斜</span>
    ]
    <span class="hljs-keyword">for</span> c <span class="hljs-keyword">in</span> win_cond:
        <span class="hljs-keyword">if</span> board[c[<span class="hljs-number">0</span>]] == board[c[<span class="hljs-number">1</span>]] == board[c[<span class="hljs-number">2</span>]] == player:
            <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
