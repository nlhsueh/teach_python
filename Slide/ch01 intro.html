<h1 id="ch01-introduction">Ch01 Introduction</h1>
<h2 id="11-%E8%B3%87%E6%96%99%E7%A7%91%E5%AD%B8">1.1 資料科學</h2>
<h3 id="%E4%BB%80%E9%BA%BC%E6%98%AF%E8%B3%87%E6%96%99%E7%A7%91%E5%AD%B8">什麼是資料科學</h3>
<blockquote>
<p>==Data science== is a multidisciplinary field that uses scientific methods, processes, algorithms and systems to extract knowledge and insights from structured and unstructured data</p>
</blockquote>
<blockquote>
<p>==Data Science== is concept to unify statistics, data analysis, machine learning and their related methods” in order to “understand and analyze actual phenomena” with data</p>
</blockquote>
<blockquote>
<p>WIKI: ==資料科學==<br />
資料科學家這個職位的頭銜則是 2009 年由 Natahn Yau 首次提及的，他認為資料科學家就是能夠從大型資料集中析取出資料，並提供某些可供非資料專家使用的東西的人。</p>
</blockquote>
<p>2009 年 1 月，數位化資料跨機構工作組發表了一份名為《駕馭科學與社會數字化資料之力》的報告，Sadkowsky 從中了解到「資料科學家」這個詞，認為該詞是自己所從事工作的最好描述。</p>
<p>資料科學家被《哈佛商業評論》稱為《二十一世紀最性感的職業》[6]後，資料科學逐漸成為一個時髦術語（英語：Buzzword)。</p>
<p>資料科學家在美歐的需求巨大，麥肯錫公司宣布全世界上此職業人才短缺超過二十萬工人[7]。《The Data Incubator》國際企業，在矽谷紐約成立，提供國際巨量資料和資料科學培訓服務。</p>
<h3 id="%E8%B3%87%E6%96%99%E7%A7%91%E5%AD%B8%E7%9A%84%E4%B8%89%E5%80%8B%E5%85%83%E7%B4%A0">資料科學的三個元素</h3>
<p>資料科學需要三個元素：資訊技術寫程式的能力、數學（特別是統計）的能力，以及領域知識。例如你要應用到交通上，你對交通的領域要了解，才能知道你要解決的問題。</p>
<p><img src="https://hackmd.io/_uploads/B13pdC9R2.png" alt="" /></p>
<h4 id="youbike">YouBike</h4>
<p>當我們租借 youbike 時，系統收集了許多的資訊，我們分析這些資料，可以知道許多使用者的行為，進而進行許多的預測與規劃。</p>
<p><img src="https://hackmd.io/_uploads/SkGhOC5R3.png" alt="" /></p>
<h4 id="%E5%AD%B8%E7%BF%92%E7%A7%91%E6%8A%80">學習科技</h4>
<p>例如現在大家透過線上教學來學習</p>
<p><img src="https://hackmd.io/_uploads/S1YFuRq0h.png" alt="" /></p>
<h4 id="%E6%A9%9F%E5%99%A8%E5%AD%B8%E7%BF%92">機器學習</h4>
<p>人工智慧（AI），機器學習（ML）和深度學習（DL）是相關但不同的概念，它們在計算機科學和人工智慧領域中具有不同的意義和用途。</p>
<ol>
<li><strong>人工智慧（AI）：</strong> 人工智慧是一個綜合性的領域，旨在創建具有智能行為的計算機系統。這包括使計算機能夠執行像人類一樣的任務，如視覺感知、語言理解、問題解決、決策制定等。AI的目標是模擬和實現人類的智能，它包括許多不同的子領域，例如機器學習和深度學習。</li>
<li><strong>機器學習（ML）：</strong> 機器學習是AI的一個子領域，它專注於開發算法和模型，使計算機能夠從數據中學習，改進性能並自主地做出決策。機器學習的核心思想是通過數據學習模式，然後使用這些模式來做出預測或決策，而無需明確的編程。ML包括監督學習、非監督學習、強化學習等不同類型的學習方式。</li>
<li><strong>深度學習（DL）：</strong> 深度學習是機器學習的一個特殊分支，它使用深度神經網絡（深度神經網絡）來處理和學習大量複雜的數據。深度學習模型通常由多層神經網絡組成，每一層都包含許多神經元。深度學習已經在圖像識別、語音識別、自然語言處理等領域取得了顯著的成功。</li>
</ol>
<p>主要的區別點：</p>
<ul>
<li>範疇：AI是一個廣泛的領域，旨在實現智能，而ML是AI的子集，它專注於數據學習。DL則是ML的一個更特殊的分支，使用深度神經網絡。</li>
<li>數據需求：AI可以包括不使用數據的知識表示方法，但ML和DL都依賴於數據來學習模式。</li>
<li>模型結構：DL使用深度神經網絡，通常包括多個隱藏層，而ML可以使用各種不同的算法和模型，包括支持向量機、決策樹等。</li>
<li>應用：AI可應用於各種領域，包括機器人、對話式助手、自駕車等。ML和DL在圖像識別、語音識別、推薦系統等方面有廣泛的應用。</li>
</ul>
<p>總的來說，AI是一個更廣泛的概念，而ML和DL則是實現AI目標的具體方法之一。深度學習在處理大規模和複雜數據方面表現出色，因此在當今的AI應用中具有重要性。</p>
<p><img src="https://hackmd.io/_uploads/r1R8uAcCn.png" alt="" /></p>
<h3 id="%E8%B3%87%E6%96%99%E5%88%86%E6%9E%90%E7%9A%84%E6%B5%81%E7%A8%8B">資料分析的流程</h3>
<h2 id="12-python-%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88">1.2 Python 程式設計</h2>
<h3 id="121-%E5%8E%9F%E5%A7%8B%E7%A8%8B%E5%BC%8F%E8%88%87%E6%A9%9F%E5%99%A8%E7%A2%BC">1.2.1 原始程式與機器碼</h3>
<p>機器碼是給機器（電腦）看的語言，十分的細微卻也很難閱讀。原始碼（source code）是以類似英文的模式所呈現的語言，容易閱讀撰寫，我們常聽到的 C, C++, Java, R, Python 都屬於原始碼。</p>
<p>這兩個語言系統不同，所以需要一個編譯器來進行編譯（Compile）。機器碼是給機器的指令，一般人難以閱讀，所以需要編譯器。編譯器分為 interpreter 和 compiler。Python 是採用 Interpreter 的方式：</p>
<p>和英語的翻譯來對照，Interpreter 類似口譯員，一聽到馬上翻譯，即便還沒有聽到後面的內容。Compiler 則比較像書本的翻譯，翻譯者會將整本書都看過後，再進行翻譯。</p>
<p><img src="https://hackmd.io/_uploads/BkLW_Rc02.png" alt="" /></p>
<h3 id="122-python-%E7%A8%8B%E5%BC%8F">1.2.2 Python 程式</h3>
<p>Python 的由來</p>
<p>Python的創始人為吉多·范羅蘇姆。1989年的聖誕節期間，吉多·范羅蘇姆為了在阿姆斯特丹打發時間，決心開發一個新的指令碼解釋程式，作為ABC語言的一種繼承。之所以選中 Python作為程式的名字，是因為他是BBC電視劇——蒙提·派森的飛行馬戲團的愛好者。ABC是由吉多參加設計的一種教學語言。就吉多本人看來，ABC這種語言非常優美和強大，是專門為非專業程式設計師設計的。但是ABC語言並沒有成功，究其原因，吉多認為是非開放造成的。吉多決心在Python中避免這一錯誤，並取得了非常好的效果，完美結合了C和其他一些語言。[wiki: python]</p>
<p><img src="https://hackmd.io/_uploads/SJZVuC902.png" alt="" /></p>
<blockquote>
<p>有趣小知識</p>
<ul>
<li>Python 是一種蛇，但Python 程式語言和蛇沒有關係。</li>
<li>原來是發明者很喜歡蒙提·派森的飛行馬戲團</li>
</ul>
</blockquote>
<p>Python 的特性</p>
<ul>
<li data-marpit-fragment="1">簡單卻強大的程式語言</li>
<li data-marpit-fragment="2">直譯語言，容易入門</li>
<li data-marpit-fragment="3">許多已開發套件/框架可供使用</li>
<li data-marpit-fragment="4">機器學習，網路爬蟲，網頁應用程式</li>
<li data-marpit-fragment="5">物件導向特性，容易包裝成套件</li>
<li data-marpit-fragment="6">問題導向</li>
<li data-marpit-fragment="7">跨平台</li>
</ul>
<blockquote>

<p>Python是一種非常流行的程式語言，用於開發各種類型的系統和應用程式。以下是一些知名的系統和應用程式，它們是使用Python開發的：</p>

</ol>
<p>這僅僅是一小部分使用Python開發的系統和應用程式的例子。Python的多功能性和簡潔的語法使其成為許多不同領域的首選程式語言之一。無論是Web開發、數據科學、機器學習還是科學研究，Python都有廣泛的應用。</p>
<h4 id="the-zen-of-python-%E9%96%8B%E7%99%BC%E5%93%B2%E5%AD%B8">The Zen of Python 開發哲學</h4>
<p>Zen 是禪的意思。寫程式也是一學禪學</p>
<p>by Tim Peters</p>
<ul>
<li data-marpit-fragment="8">Python，以編寫優美的程式碼為目標。</li>
<li data-marpit-fragment="9">而優美的程式碼應該簡單明瞭。</li>
<li data-marpit-fragment="10">優美的程式碼應該編寫簡單，不該有複雜的關係。</li>
<li data-marpit-fragment="11">即使需要複雜的關係，也不該有繁複的介面。</li>
<li data-marpit-fragment="12">優美的程式碼不該有過多的內嵌結構。</li>
<li data-marpit-fragment="13">優美的程式碼寧願分散程序，也不該擠在一行。</li>
<li data-marpit-fragment="14">優美的程式碼，一定要易讀，加上註解吧。</li>
<li data-marpit-fragment="15">特例也不該違背這些規則，</li>
<li data-marpit-fragment="16">即使實用性打敗了純粹性。</li>

<li data-marpit-fragment="18">錯誤不該被無聲地忽略，</li>
<li data-marpit-fragment="19">除非需要，否則要捕捉所有的錯誤。</li>
<li data-marpit-fragment="20">用明顯的方法來完成一件事，而且最好只有一種。</li>
<li data-marpit-fragment="21">不要去猜想完成程序的方式，只需要用一種明顯的解法。</li>
<li data-marpit-fragment="22">先考慮過程式是好的，但必須要動手寫。</li>
<li data-marpit-fragment="23">如果實作難以被說明，那就是個壞主意。</li>
<li data-marpit-fragment="24">如果實作能輕鬆說明，那可能是個好主意。</li>
<li data-marpit-fragment="25">能夠被說明的程式才是好程式。</li>

<h4 id="%E6%AA%A2%E6%9F%A5%E7%9C%8B%E7%9C%8B--mac">檢查看看- MAC</h4>
<p>先按 command+space，然後打 terminal.app 來打開終端機。然後輸入python3 --version，即可得到你系統的已安裝的Python 版本。</p>
<pre><code class="language-python">$ python3 --version
Python <span class="hljs-number">3.6</span><span class="hljs-number">.3</span>
</code></pre>
<h4 id="%E6%AA%A2%E6%9F%A5%E7%9C%8B%E7%9C%8B--window">檢查看看- Window</h4>
<p>要檢查在Windows環境中是否已經安裝Python，你可以執行以下步驟：</p>
<ol>
<li>開啟命令提示字元：按下Win + R，然後輸入&quot;cmd&quot;，並按Enter，這會打開命令提示字元。</li>
<li>在命令提示字元中，輸入以下命令並按Enter：<pre><code>python --version
</code></pre>
或者，你也可以使用以下命令：<pre><code>python -V
</code></pre>
</li>
<li>如果Python已經安裝，命令提示字元將顯示已安裝的Python版本號。例如，它可能會顯示類似以下的內容：<pre><code>Python 3.9.6
</code></pre>
如果未安裝Python，則會顯示一條錯誤消息，指出未找到命令。</li>
</ol>
<p>另外，你也可以通過在文件總管中尋找Python的安裝目錄來檢查是否已安裝Python。通常，Python被安裝在&quot;C:\Program Files\Python&quot;目錄下。如果你在該目錄中找到Python的安裝文件，那麼Python已經安裝在你的系統中。</p>
<h3 id="132-%E7%94%A8%E5%85%A7%E5%BB%BA%E7%9A%84-idle-%E5%AF%AB%E7%A8%8B%E5%BC%8F">1.3.2 用內建的 IDLE 寫程式</h3>
<p>Python的IDLE（Integrated Development and Learning Environment）是一個內建的集成式開發和學習環境，可以用來編寫、運行和測試Python程式碼。以下是使用Python的內建IDLE的基本操作方式：</p>
<ol>
<li><strong>啟動IDLE</strong>：
<ul>
<li>在Windows上，你可以從「開始」菜單中的Python文件夾中找到IDLE並啟動它。</li>
<li>在Linux和macOS上，你可以在終端中執行<code>idle</code>命令來啟動IDLE。</li>
</ul>
</li>
<li><strong>建立新程式檔案</strong>：
<ul>
<li>打開IDLE後，你可以選擇「檔案」 &gt; 「新檔案」以建立一個新的Python程式檔案。你也可以使用快捷鍵Ctrl+N。</li>
</ul>
</li>
<li><strong>編寫程式碼</strong>：
<ul>
<li>在新程式檔案中，你可以開始編寫Python程式碼。輸入你的程式碼，例如：</li>
</ul>
<pre><code class="language-python"><span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Hello, World!&quot;</span>)
</code></pre>
</li>
<li><strong>儲存程式檔案</strong>：
<ul>
<li>在編寫完程式碼後，你可以選擇「檔案」 &gt; 「另存新檔」以保存你的程式檔案，然後選擇一個目錄和檔案名稱，並確保檔案名稱以<code>.py</code>為結尾（例如，<code>my_program.py</code>）。</li>
</ul>
</li>
<li><strong>執行程式</strong>：
<ul>
<li>保存程式檔案後，你可以選擇「執行」 &gt; 「運行模組」，或者使用快捷鍵F5，來執行你的Python程式。</li>
<li>執行結果將會顯示在IDLE的互動窗口中。</li>
</ul>
</li>
<li><strong>互動模式</strong>：
<ul>
<li>IDLE還提供了互動模式，你可以在互動窗口中即時執行Python命令和表達式，這對於測試和實驗很有用。</li>
</ul>
</li>
<li><strong>調試工具</strong>：
<ul>
<li>IDLE包括一些簡單的調試工具，如單步執行和斷點，可以幫助你找到程式碼中的錯誤。</li>
</ul>
</li>
<li><strong>查看說明文件</strong>：
<ul>
<li>你可以在IDLE中訪問Python的說明文件，查找有關函數、模組和語言特性的信息。選擇「幫助」 &gt; 「IDLE幫助」以訪問說明文件。</li>
</ul>
</li>
</ol>
<p>這些是使用Python內建的IDLE編寫程式的基本操作。它是一個適合初學者的簡單而強大的工具，可用於學習和開發Python程式。</p>
<h3 id="133-google-colab-%E5%88%9D%E5%AD%B8%E6%8E%A8%E8%96%A6">1.3.3 Google colab (初學推薦)</h3>

<p>使用Google Colab（Colaboratory）學習Python有許多好處，特別是對於初學者和學生來說。以下是一些使用Google Colab的好處：</p>

<h3 id="134-jupyter-notebook">1.3.4 Jupyter Notebook</h3>
<ul>
<li data-marpit-fragment="28"><a href="https://jupyter.org/">https://jupyter.org/</a></li>
<li data-marpit-fragment="29">安裝完 Anaconda 就內建有 Jupyter Notebook 可以使用; 也可以獨立安裝</li>
<li data-marpit-fragment="30">具備程式模式和筆記模式，可以編寫程式編寫筆記</li>
</ul>
<p>Jupyter Notebook（前身是IPython Notebook）是一個非常流行的交互式計算環境，特別適用於Python開發和數據科學領域。它具有許多功能，使得Python開發更加方便和有趣。以下是Jupyter Notebook的一些主要功能，特別是在Python開發方面的應用：</p>
<ol>
<li><strong>交互式編程：</strong> Jupyter Notebook允許你逐步執行程式碼塊，查看結果並進行修改。這種互動性非常有助於測試和調試程式碼。</li>
<li><strong>支援多種語言：</strong> 雖然最初是為Python設計的，但Jupyter Notebook支援多種編程語言，包括R、Julia、Scala等，使其成為多語言數據科學和計算的理想工具。</li>
<li><strong>內置語法高亮和自動完成：</strong> Jupyter Notebook具有優秀的語法高亮和自動完成功能，可以幫助你快速編寫程式碼，減少錯誤。</li>
<li><strong>內置視覺化：</strong> 你可以輕鬆地將圖表、圖像和其他多媒體內容嵌入到筆記本中，以創建可視化報告和數據可視化。</li>
<li><strong>Markdown和LaTeX支援：</strong> Jupyter Notebook支援Markdown標記語言，可以在程式碼塊之間添加文本說明、數學方程式等。你甚至可以使用LaTeX來撰寫數學方程式。</li>
<li><strong>即時共享：</strong> 你可以將Jupyter Notebook筆記本共享給他人，無需安裝任何特定的軟件。許多在線平台和服務也支援Jupyter筆記本的共享。</li>
<li><strong>數據科學工具支援：</strong> Jupyter Notebook可以無縫集成各種數據科學庫，如NumPy、Pandas、Matplotlib、Scikit-Learn等，使其成為數據分析和機器學習的理想環境。</li>
<li><strong>擴展性：</strong> 你可以安裝各種擴展，以增加Jupyter Notebook的功能，包括將其與大數據處理框架（如Apache Spark）集成。</li>
<li><strong>維護和管理：</strong> Jupyter Notebook提供了一個直觀的界面，用戶可以管理筆記本、核心（kernels）和擴展，以及對運行時進行調試和性能監控。</li>
<li><strong>教育和展示：</strong> Jupyter Notebook非常適合教育和展示用途。教師可以創建互動式教學材料，並學生可以在筆記本中實際執行程式碼示例。</li>
</ol>
<p>總的來說，Jupyter Notebook是一個強大且多功能的工具，它提供了一個互動式和可視化的編程環境，特別適合Python開發、數據科學和教育。無論你是學術研究、數據分析、機器學習還是教學，Jupyter Notebook都是一個極具價值的工具。</p>
<h3 id="135-vs-code">1.3.5 VS code</h3>
<p>Visual Studio Code（VS Code）是一個強大的開源程式碼編輯器，它具有豐富的功能和擴展，特別適合Python開發。以下是VS Code的一些主要功能，特別是在Python開發方面的應用：</p>
<ol>

<li><strong>集成式終端：</strong> VS Code內置了終端，你可以在編輯器中直接運行命令和Python腳本，無需切換到終端機。</li>
<li><strong>集成式調試器：</strong> VS Code支援多種Python調試器的擴展，你可以設置斷點、逐步執行程式碼、監視變數，以及查看調試信息。</li>
<li><strong>擴展市場：</strong> VS Code擁有龐大的擴展市場，你可以輕鬆安裝各種Python相關的擴展，如linter、語法檢查工具、自動完成工具等，以擴展功能。</li>
<li><strong>集成式版本控制：</strong> VS Code支援多種版本控制系統，如Git，你可以在編輯器中進行版本控制操作。</li>
<li><strong>智能建議：</strong> VS Code的自動完成功能非常強大，它可以根據你的編碼習慣和程式碼上下文提供智能建議，節省時間並減少錯誤。</li>
<li><strong>Python虛擬環境管理：</strong> VS Code可以輕鬆集成Python虛擬環境，讓你可以在不同的Python環境中進行開發，確保項目的隔離性。</li>
<li><strong>整合的Jupyter Notebook支援：</strong> VS Code允許你直接在編輯器中運行和編輯Jupyter Notebook文件，提供了交互性編程的便利。</li>
<li><strong>擴展性：</strong> 如果需要其他功能，你可以在VS Code的市場中找到擴展，或者自己創建擴展，以滿足特定需求。</li>
</ol>
<p>總的來說，VS Code是一個功能豐富且高度可配置的程式碼編輯器，特別適合Python開發，因為它提供了許多強大的Python相關工具和擴展，可以加速開發過程並提高程式碼質量。</p>
<h2 id="14-anacondaspyder-%E9%96%8B%E7%99%BC%E7%92%B0%E5%A2%83%E5%AE%89%E8%A3%9D%E8%88%87%E4%BB%8B%E7%B4%B9">1.4 Anaconda/Spyder 開發環境安裝與介紹</h2>

<h3 id="141-download-and-run">1.4.1 Download and Run</h3>
<p>==Anaconda== 是一個免費開源的Python和R語言的發行版本，用於計算科學（數據科學、機器學習、大數據處理和預測分析），Anaconda致力於簡化包管理和部署。Anaconda的包使用軟體包管理系統 Conda 進行管理。超過1200萬人使用Anaconda發行版本，並且Anaconda擁有超過1400個適用於Windows、Linux和MacOS的數據科學軟體包。</p>
<p>==Spyder==（前身為Pydee）是一個使用Python語言的開放原始碼跨平台科學運算整合開發環境(IDE)。Spyder整合了NumPy，SciPy，Matplotlib與IPython，以及其他開源軟體。</p>
<p>1.4.2 Spyder 介紹</p>
<ul>
<li data-marpit-fragment="31">可以客製化設定</li>
<li data-marpit-fragment="32">快速鍵</li>
<li data-marpit-fragment="33">具備除錯功能</li>
<li data-marpit-fragment="34">逐行執行，觀看程式流程</li>
<li data-marpit-fragment="35">中斷點</li>
<li data-marpit-fragment="36">觀看變數</li>
</ul>
<h2 id="15-%E7%B5%A6%E5%AD%B8%E7%BF%92%E8%80%85">1.5 給學習者</h2>
<ul>
<li data-marpit-fragment="37">自己動手做: 看起來都不難，但寫起來未必簡單。一定得捲起袖子自己寫。本課程雖然會提供程式碼，但希望大家是在「實作做不出來」的情況下參考。參考後還是能夠自己寫過一遍。</li>
<li data-marpit-fragment="38">嘗試錯誤: 在開發的過程中，會遇到許多錯誤（編譯錯誤或是執行錯誤），可能是語法不熟，可能是邏輯錯誤，請多加嘗試，確認自己的觀念正確。</li>

<h2 id="16-%E7%B7%9A%E4%B8%8A%E5%AD%B8%E7%BF%92">1.6 線上學習</h2>
<p><img src="https://hackmd.io/_uploads/r16_a39R3.png" alt="" /></p>
<p>線上自學的趨勢在當今教育和學習領域中變得越來越重要，並且具有多方面的影響和重要性。以下是有關線上自學趨勢和其重要性的一些方面：</p>
<ol>
<li><strong>學習的自由度：</strong> 線上自學為學習者提供了更大的自由度和彈性。學生可以選擇自己的學習速度，時間和地點。這種自由度使學習適應了不同的學習風格和需求。</li>
<li><strong>便捷性和可訪問性：</strong> 線上課程和資源使教育變得更加可訪問。學生無需前往學校或教室，而是可以在家中或任何有互聯網連接的地方進行學習。這有助於克服地理位置和交通等問題。</li>
<li><strong>資源多樣性：</strong> 線上自學提供了各種多樣化的學習資源，包括教育平台、課程、教材、視頻教程、網絡論壇等。學生可以根據自己的需求和興趣選擇適合的資源。</li>
<li><strong>以問題為導向的學習：</strong> 學習者可以根據自己的問題和需求選擇相關的學習資源，實現以問題為導向的學習。這有助於提高學習的實用性和效率。</li>
<li><strong>持續學習和自我提升：</strong> 現代社會中，持續學習和自我提升變得至關重要。線上自學使人們能夠隨時隨地學習新知識和技能，以應對不斷變化的工作市場和技術要求。</li>
<li><strong>開放教育資源（OER）：</strong> 開放教育資源是線上自學的一個重要方面，它使教育資源對所有人免費開放。這種共享知識的模式有助於提高全球教育的可及性。</li>
<li><strong>自主學習和自我管理：</strong> 線上自學要求學生具備自主學習和自我管理的能力。這有助於培養學生的自主性和解決問題的能力。</li>
<li><strong>技術技能和數字素養：</strong> 線上自學通常需要使用各種數字工具和技術，這有助於提高學生的技術技能和數字素養，這在現代社會中至關重要。</li>
</ol>
<p>線上自學是一個具有革命性影響的趨勢，它正在改變教育的方式和可訪問性。它提供了無限的學習機會，可以適應各種需求和背景的學習者。無論是學術知識、職業技能還是個人興趣，線上自學都可以提供一個開放和自由的學習環境。</p>
