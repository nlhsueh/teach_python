<header>Python 程式設計 | 第四章：集合物件</header>
<h2 id="%E6%9C%AC%E7%AB%A0%E5%AD%B8%E7%BF%92%E9%87%8D%E9%BB%9E">本章學習重點</h2>
<ul>
<li data-marpit-fragment="1"><strong>4.1 List 集合物件 (List)</strong>
<ul>
<li>List 建立與概念、新增刪改與排序、擷取與切片 (Slicing)</li>
<li>列表推導式、多元排序、值比較 vs 參考比較 (== vs is)、氣泡排序法</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>4.2 Tuple 集合物件 (Tuple)</strong>
<ul>
<li>定義、存取、效能優勢、打包與開箱 (Unpacking)、模式匹配 (Match-Case)</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>4.3 Set 集合物件 (Set)</strong>
<ul>
<li>去重特性、集合數學運算（交集、聯集、差集）、Set 的 CRUD</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>4.4 Dict 集合物件 (Dict)</strong>
<ul>
<li>Key-Value 對應、鍵的唯讀限制、現代字典合併 (<code>|</code>, <code>|=</code>)、字典推導式、<code>zip(..., strict=True)</code></li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>4.5 綜合應用 (iBike Analysis)</strong>
<ul>
<li>讀入台中市政府 iBike 開放資料 JSON 格式並進行統計分析</li>
</ul>
</li>
</ul>

<ul>
<li data-marpit-fragment="1">列表（List）是 Python 中最常用的集合物件，用中括號 <code>[]</code> 包裹：</li>
<li data-marpit-fragment="2">成員可以是<strong>不同型態</strong>的資料，甚至可以是另一個 List (巢狀結構)。</li>

<pre><code class="language-python"><span class="hljs-comment"># 建立一個巢狀成績 List</span>
nick_grade = [<span class="hljs-string">&#x27;nick&#x27;</span>, <span class="hljs-string">&#x27;S9201201&#x27;</span>, [<span class="hljs-number">90</span>, <span class="hljs-number">72</span>, <span class="hljs-number">100</span>]]
albert_grade = [<span class="hljs-string">&#x27;albert&#x27;</span>, <span class="hljs-string">&#x27;S9201202&#x27;</span>, [<span class="hljs-number">99</span>, <span class="hljs-number">68</span>, <span class="hljs-number">90</span>]]

<span class="hljs-comment"># 將多個學生的成績包裝在一個大 List 中</span>
grades = [nick_grade, albert_grade]

<span class="hljs-comment"># 建立空 List </span>
empty_list_1 = []
empty_list_2 = <span class="hljs-built_in">list</span>()
</code></pre>

<h2 id="413-%E8%B3%87%E6%96%99%E7%9A%84%E5%88%AA%E9%99%A4-remove-pop-clear">4.1.3 資料的刪除 (remove, pop, clear)</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>remove</code></strong>：依據<strong>元素的值</strong>進行刪除（若值不存在會報錯）。</li>

</ul>
<pre><code class="language-python">students = [<span class="hljs-string">&#x27;nick&#x27;</span>, <span class="hljs-string">&#x27;albert&#x27;</span>, <span class="hljs-string">&#x27;jie&#x27;</span>]

students.remove(<span class="hljs-string">&#x27;nick&#x27;</span>)  <span class="hljs-comment"># 刪除 &#x27;nick&#x27;</span>

popped = students.pop()  <span class="hljs-comment"># 移除並回傳最後一個元素 (&#x27;jie&#x27;)</span>
<span class="hljs-built_in">print</span>(popped)

popped_first = students.pop(<span class="hljs-number">0</span>) <span class="hljs-comment"># 移除第一個元素</span>

students.clear()         <span class="hljs-comment"># 刪除所有內容</span>
</code></pre>

<h2 id="414-%E8%B3%87%E6%96%99%E7%9A%84%E6%8E%92%E5%BA%8F-sort-sorted">4.1.4 資料的排序 (sort, sorted)</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>sort()</code> 方法</strong>：直接修改原本的 List 內容（原地排序 / in-place）。</li>
<li data-marpit-fragment="2"><strong><code>sorted()</code> 內建函式</strong>：不改變原 List，排序後傳回一個<strong>新的</strong> List 物件。</li>
</ul>
<pre><code class="language-python">grades = [<span class="hljs-number">90</span>, <span class="hljs-number">72</span>, <span class="hljs-number">100</span>, <span class="hljs-number">60</span>]

<span class="hljs-comment"># 1. 使用 sorted (原 grades 不變)</span>
new_grades = <span class="hljs-built_in">sorted</span>(grades)
<span class="hljs-built_in">print</span>(grades)      <span class="hljs-comment"># [90, 72, 100, 60]</span>
<span class="hljs-built_in">print</span>(new_grades)  <span class="hljs-comment"># [60, 72, 90, 100]</span>

<span class="hljs-comment"># 2. 使用 sort (直接修改原 grades)</span>
grades.sort()
<span class="hljs-built_in">print</span>(grades)      <span class="hljs-comment"># [60, 72, 90, 100]</span>
</code></pre>

<pre><code class="language-python">grade = [<span class="hljs-number">11</span>, <span class="hljs-number">22</span>, <span class="hljs-number">99</span>, <span class="hljs-number">35</span>, <span class="hljs-number">59</span>]

<h2 id="416-%E8%B3%87%E6%96%99%E7%9A%84%E8%B5%B0%E8%A8%AA%E8%88%87%E9%81%8D%E6%AD%B7">4.1.6 資料的走訪與遍歷</h2>
<ul>
<li data-marpit-fragment="1">利用 <code>for</code> 迴圈可以直接遍歷元素。</li>
<li data-marpit-fragment="2">若需要同時取得「索引值」與「元素值」，可搭配 <strong><code>enumerate</code></strong> 函式：</li>
</ul>
<pre><code class="language-python">grade = [<span class="hljs-number">11</span>, <span class="hljs-number">22</span>, <span class="hljs-number">99</span>, <span class="hljs-number">35</span>, <span class="hljs-number">59</span>]

<span class="hljs-comment"># 1. 遍歷求加總與平均</span>
total = <span class="hljs-number">0</span>
<span class="hljs-keyword">for</span> g <span class="hljs-keyword">in</span> grade:
    total += g
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;平均分數:&quot;</span>, total // <span class="hljs-built_in">len</span>(grade))

<span class="hljs-comment"># 2. 調分練習：不及格者一律調整為 60 分</span>
<span class="hljs-keyword">for</span> i, g <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(grade):
    <span class="hljs-keyword">if</span> g &lt; <span class="hljs-number">60</span>:
        grade[i] = <span class="hljs-number">60</span>
</code></pre>

<span class="hljs-comment"># 2. 列表推導式寫法 (等價於上方)</span>
b = [i <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">10</span>)]

<h2 id="419-%E5%A4%9A%E5%85%83%E6%8E%92%E5%BA%8F%E8%88%87-lambda-%E6%87%89%E7%94%A8">4.1.9 多元排序與 Lambda 應用</h2>
<ul>
<li data-marpit-fragment="1">使用 <code>sorted()</code> 時，可搭配 <code>key</code> 參數與 <code>lambda</code> 匿名函式指定客製化的排序指標。</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># 欄位為: [英文, 數學, 物理]</span>
grade_data = [[<span class="hljs-number">11</span>, <span class="hljs-number">22</span>, <span class="hljs-number">33</span>], [<span class="hljs-number">90</span>, <span class="hljs-number">91</span>, <span class="hljs-number">92</span>], [<span class="hljs-number">77</span>, <span class="hljs-number">88</span>, <span class="hljs-number">99</span>], [<span class="hljs-number">44</span>, <span class="hljs-number">55</span>, <span class="hljs-number">66</span>]]

<span class="hljs-comment"># 預設排序 (依據第一個元素排序)</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">sorted</span>(grade_data)) <span class="hljs-comment"># [[11,22,33], [44,55,66], [77,88,99], [90,91,92]]</span>

<span class="hljs-comment"># 依據各科總分排序 (比較各子 list 的總和)</span>
g_sum = <span class="hljs-built_in">sorted</span>(grade_data, key=<span class="hljs-keyword">lambda</span> x: <span class="hljs-built_in">sum</span>(x))

<span class="hljs-comment"># 依據最後一科 (物理) 排序</span>
g_last = <span class="hljs-built_in">sorted</span>(grade_data, key=<span class="hljs-keyword">lambda</span> x: x[-<span class="hljs-number">1</span>])
</code></pre>

<h2 id="4110--%E8%88%87-is-%E7%9A%84%E5%B7%AE%E5%88%A5-equality-vs-identity">4.1.10 == 與 is 的差別 (Equality vs Identity)</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>==</code> 運算子</strong>：用來比較兩個物件的**「值 (Value)」是否相等**。</li>
<li data-marpit-fragment="2"><strong><code>is</code> 運算子</strong>：用來比較兩個變數是否指向**「同一個記憶體位址 (Identity / Reference)」**。</li>
</ul>
<pre><code class="language-python">grade = [<span class="hljs-number">11</span>, <span class="hljs-number">22</span>, <span class="hljs-number">99</span>, <span class="hljs-number">35</span>, <span class="hljs-number">59</span>]
g = grade
gc = grade.copy() <span class="hljs-comment"># 建立一個複本，值相同但位址不同</span>

<span class="hljs-built_in">print</span>(grade == g)  <span class="hljs-comment"># True (值相等)</span>
<span class="hljs-built_in">print</span>(grade <span class="hljs-keyword">is</span> g)  <span class="hljs-comment"># True (同一參考)</span>

<span class="hljs-built_in">print</span>(grade == gc) <span class="hljs-comment"># True (值相等)</span>
<span class="hljs-built_in">print</span>(grade <span class="hljs-keyword">is</span> gc) <span class="hljs-comment"># False (不同位址)</span>
</code></pre>

size = <span class="hljs-built_in">len</span>(rand_list)
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">1</span>, size):
    <span class="hljs-comment"># 最後的 i 個已經排好了，不用再比</span>

<div class="ccq-columns">

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c"><strong>正確答案：C.</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2"><strong><code>remove(val)</code></strong>：用來移除列表中第一個值等於 <code>val</code> 的成員。它是不帶回傳值（<code>None</code>）的，若找不到該值會報 <code>ValueError</code>。</li>
<li data-marpit-fragment="3"><strong><code>pop(index)</code></strong>：移除指定索引 <code>index</code> 的成員並<strong>回傳該被移除的物件</strong>。若不傳入引數，則預設是移除最尾端元素（等同 <code>pop(-1)</code>）。</li>
<li data-marpit-fragment="4">故 C 選項敘述完全正確。</li>
</ul>

<h2 id="421-tuple-%E7%9A%84%E5%AE%9A%E7%BE%A9%E8%88%87%E7%89%B9%E6%80%A7">4.2.1 Tuple 的定義與特性</h2>
<ul>
<li data-marpit-fragment="1">元組（Tuple）使用小括號 <code>()</code> 定義，最大的特性是**「不可變性 (Immutable)」**。</li>
<li data-marpit-fragment="2">內容建立後，不能新增、修改、刪除個別元素。主要作為<strong>唯讀的 List</strong>。</li>
</ul>
<pre><code class="language-python">tup1 = (<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;FCU&#x27;</span>, <span class="hljs-number">172</span>, <span class="hljs-number">75</span>)
tup2 = (<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>)
tup3 = <span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>, <span class="hljs-string">&quot;c&quot;</span>, <span class="hljs-string">&quot;d&quot;</span> <span class="hljs-comment"># 不加括號預設也是 Tuple</span>

<span class="hljs-comment"># 唯讀性驗證 (執行此行會發生 TypeError)</span>
<span class="hljs-comment"># tup2[0] = 100 </span>

t = (<span class="hljs-string">&#x27;a&#x27;</span>, <span class="hljs-string">&#x27;b&#x27;</span>, <span class="hljs-string">&#x27;c&#x27;</span>, <span class="hljs-string">&#x27;d&#x27;</span>, <span class="hljs-string">&#x27;e&#x27;</span>)
<span class="hljs-built_in">print</span>(t[<span class="hljs-number">0</span>])   <span class="hljs-comment"># 支援索引取得</span>
<span class="hljs-built_in">print</span>(t[<span class="hljs-number">1</span>:<span class="hljs-number">4</span>]) <span class="hljs-comment"># 支援切片</span>
</code></pre>

<h2 id="422-tuple-%E7%9A%84%E6%95%88%E8%83%BD%E5%84%AA%E5%8B%A2">4.2.2 Tuple 的效能優勢</h2>
<ul>
<li data-marpit-fragment="1"><strong>為什麼要使用 Tuple 替代 List？</strong>
<ol>
<li><strong>效能更好</strong>：由於記憶體長度與內容固定，Python 底層對其有記憶體與速度優化，存取速度較 List 更快。</li>
<li><strong>資料安全</strong>：保護設定檔或常數清單，防止在程式執行過程中被無意中修改。</li>
<li><strong>可作為字典的 Key</strong>：因為不可變 (hashable)，Tuple 可做為 Dict 的鍵，而 List 則不行。</li>
</ol>
</li>
</ul>

<h2 id="423-%E5%85%83%E7%B5%84%E6%89%93%E5%8C%85%E8%88%87%E9%96%8B%E7%AE%B1-pack--unpack">4.2.3 元組打包與開箱 (Pack &amp; Unpack)</h2>
<ul>
<li data-marpit-fragment="1"><strong>元組打包 (Pack)</strong>：將多個變數/數值包裝在一個元組中。</li>
<li data-marpit-fragment="2"><strong>元組開箱 (Unpack)</strong>：將元組中的元素一次性取出賦予多個變數（數量必須一致）。</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># 元組打包</span>
person = (<span class="hljs-string">&#x27;male&#x27;</span>, <span class="hljs-number">10</span>, <span class="hljs-string">&#x27;nick&#x27;</span>) 

<span class="hljs-comment"># 元組開箱</span>
sex, age, name = person
<span class="hljs-built_in">print</span>(sex)  <span class="hljs-comment"># &#x27;male&#x27;</span>
<span class="hljs-built_in">print</span>(age)  <span class="hljs-comment"># 10</span>
<span class="hljs-built_in">print</span>(name) <span class="hljs-comment"># &#x27;nick&#x27;</span>
</code></pre>

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88b-1"><strong>正確答案：B.</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">Tuple 內部元素的<strong>參考位置</strong>不可變，意即我們無法改變 <code>tup</code> 去指向其他變數（例如 <code>tup[2] = 5</code> 會報錯）。</li>
<li data-marpit-fragment="3">但如果 Tuple 的內部成員是一個<strong>可變物件（如 list <code>[3, 4]</code>）</strong>，我們依然可以直接對該 list 內部的元素值進行修改。</li>
<li data-marpit-fragment="4"><code>tup[2][0] = 99</code> 修改了該 list 內部第 0 項為 99，這是允許的，並不會改變 Tuple 記錄該 list 實體的位址。</li>
<li data-marpit-fragment="5">故能順利執行，印出 <code>(1, 2, [99, 4])</code>。</li>
</ul>

</ul>

<header>Python 程式設計 | 第四章：集合物件</header>
<h2 id="431-set-%E7%9A%84%E5%AE%9A%E7%BE%A9%E8%88%87%E9%81%8B%E7%AE%97">4.3.1 Set 的定義與運算</h2>
<ul>
<li data-marpit-fragment="1">集合（Set）是<strong>無序</strong>且元素<strong>不重複</strong>的容器。</li>
<li data-marpit-fragment="2">支援聯集（<code>|</code>）、交集（<code>&amp;</code>）、差集（<code>-</code>）等數學運算：</li>
</ul>
<pre><code class="language-python">baseball = [<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;Albert&#x27;</span>, <span class="hljs-string">&#x27;Jie&#x27;</span>]
piano = [<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;Doris&#x27;</span>]
highGrade = [<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;Doris&#x27;</span>, <span class="hljs-string">&#x27;Anna&#x27;</span>]

baseballSet = <span class="hljs-built_in">set</span>(baseball)
pianoSet = <span class="hljs-built_in">set</span>(piano)

<span class="hljs-comment"># 1. 聯集 (兩社團所有的不重複人名)</span>
community = baseballSet | pianoSet <span class="hljs-comment"># {&#x27;Nick&#x27;, &#x27;Albert&#x27;, &#x27;Jie&#x27;, &#x27;Doris&#x27;}</span>

<span class="hljs-comment"># 2. 交集 (高分群且參加社團者)</span>
commAndHigh = community &amp; <span class="hljs-built_in">set</span>(highGrade) <span class="hljs-comment"># {&#x27;Nick&#x27;, &#x27;Doris&#x27;}</span>
</code></pre>

<ul>

<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">集合（Set）具備<strong>元素不重複</strong>的特性，因此 <code>set([1, 2, 2, 3])</code> 在建立時會自動去重，轉換成 <code>{1, 2, 3}</code>。</li>
<li data-marpit-fragment="3">集合同時具備<strong>無順序性</strong>的特性，表示集合間的比較與元素排列順序無關。因此，集合 <code>{1, 2, 3}</code> 和 <code>{3, 2, 1}</code> 包含完全相同的成員，兩者相等比較為 <code>True</code>。</li>
</ul>

<header>Python 程式設計 | 第四章：集合物件</header>
<h2 id="441-dict-%E7%9A%84%E5%BB%BA%E7%AB%8B%E8%88%87%E5%9F%BA%E6%9C%AC%E8%AE%80%E5%AF%AB">4.4.1 Dict 的建立與基本讀寫</h2>
<ul>
<li data-marpit-fragment="1">字典（Dict）由 <strong>Key (鍵) - Value (值)</strong> 對編組。使用大括號 <code>{}</code> 或 <code>dict()</code> 宣告：</li>
<li data-marpit-fragment="2"><strong>重要限制</strong>：鍵（Key）必須是不可變型態（如字串、數值、Tuple），<strong>不可使用可變型態（如 List）做為 Key</strong>！</li>
</ul>
<pre><code class="language-python">family = {<span class="hljs-string">&#x27;dad&#x27;</span>: <span class="hljs-string">&#x27;Jack&#x27;</span>, <span class="hljs-string">&#x27;mom&#x27;</span>: <span class="hljs-string">&#x27;LiLi&#x27;</span>, <span class="hljs-string">&#x27;size&#x27;</span>: <span class="hljs-number">2</span>}

<span class="hljs-comment"># 新增/修改鍵值對 (若 key 存在則覆蓋，不存在則新增)</span>
grade = {<span class="hljs-number">1</span>: <span class="hljs-number">12</span>, <span class="hljs-number">2</span>: <span class="hljs-number">100</span>}
grade[<span class="hljs-number">3</span>] = <span class="hljs-number">90</span>  <span class="hljs-comment"># 新增鍵 3</span>
grade[<span class="hljs-number">2</span>] = <span class="hljs-number">95</span>  <span class="hljs-comment"># 修改鍵 2 的值</span>

<span class="hljs-comment"># 刪除鍵值對 (使用 del 或 pop)</span>
<span class="hljs-keyword">del</span> grade[<span class="hljs-number">1</span>]
popped_val = grade.pop(<span class="hljs-number">3</span>) <span class="hljs-comment"># 移除並回傳鍵 3 的值 (90)</span>
</code></pre>

<header>Python 程式設計 | 第四章：集合物件</header>
<h2 id="442-%E7%8F%BE%E4%BB%A3%E5%AD%97%E5%85%B8%E5%90%88%E4%BD%B5%E6%96%B9%E6%B3%95-python-39">4.4.2 現代字典合併方法 (Python 3.9+)</h2>
<ul>
<li data-marpit-fragment="1">從 Python 3.9 起，可以使用 <code>|</code> (聯集合併) 與 <code>|=</code> (就地更新) 來進行字典合併：</li>
</ul>
<pre><code class="language-python">dict1 = {<span class="hljs-string">&#x27;apple&#x27;</span>: <span class="hljs-number">10</span>, <span class="hljs-string">&#x27;banana&#x27;</span>: <span class="hljs-number">20</span>}
dict2 = {<span class="hljs-string">&#x27;banana&#x27;</span>: <span class="hljs-number">30</span>, <span class="hljs-string">&#x27;cherry&#x27;</span>: <span class="hljs-number">40</span>}

<span class="hljs-comment"># 1. 字典合併 (重複 key 則以後者為準，不改變原字典)</span>
merged = dict1 | dict2
<span class="hljs-built_in">print</span>(merged) <span class="hljs-comment"># {&#x27;apple&#x27;: 10, &#x27;banana&#x27;: 30, &#x27;cherry&#x27;: 40}</span>
<span class="hljs-built_in">print</span>(dict1)  <span class="hljs-comment"># {&#x27;apple&#x27;: 10, &#x27;banana&#x27;: 20}</span>

<span class="hljs-comment"># 2. 字典原地更新</span>
dict1 |= dict2
<span class="hljs-built_in">print</span>(dict1)  <span class="hljs-comment"># {&#x27;apple&#x27;: 10, &#x27;banana&#x27;: 30, &#x27;cherry&#x27;: 40}</span>
</code></pre>

<ul>
<li data-marpit-fragment="1">透過 <code>zip</code> 搭配 <code>strict=True</code> 可以確保兩個清單在長度一致時才進行轉換：</li>
</ul>
<pre><code class="language-python">std = [<span class="hljs-string">&#x27;nick&#x27;</span>, <span class="hljs-string">&#x27;john&#x27;</span>, <span class="hljs-string">&#x27;mac&#x27;</span>]

<span class="hljs-comment"># 1. 直接以 zip 轉成 dict</span>
std_dict = <span class="hljs-built_in">dict</span>(<span class="hljs-built_in">zip</span>(std, grades, strict=<span class="hljs-literal">True</span>))

<span class="hljs-comment"># 2. 字典推導式 (Dict Comprehension)</span>
<span class="hljs-comment"># 語法: {key_expr: value_expr for item in iterable}</span>
dict_comp = {k: v <span class="hljs-keyword">for</span> k, v <span class="hljs-keyword">in</span> <span class="hljs-built_in">zip</span>(std, grades, strict=<span class="hljs-literal">True</span>)}
</code></pre>

<h2 id="445-json-%E6%AA%94%E6%A1%88%E8%99%95%E7%90%86-jsonloads--dumps">4.4.5 JSON 檔案處理 (json.loads &amp; dumps)</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>json.loads()</code></strong>：將 JSON 格式的<strong>字串</strong>解析轉換為 Python 的 <strong>Dict / List</strong> 物件。</li>
<li data-marpit-fragment="2"><strong><code>json.dumps()</code></strong>：將 Python 的 <strong>Dict / List</strong> 編碼轉換為 JSON 格式的<strong>字串</strong>。</li>
</ul>
<pre><code class="language-python"><span class="hljs-keyword">import</span> json

<span class="hljs-comment"># JSON 格式字串</span>
gStr = <span class="hljs-string">&#x27;{&quot;eng&quot;: 60, &quot;math&quot;: 78, &quot;phy&quot;: 100}&#x27;</span>

<span class="hljs-comment"># 1. 載入 (JSON -&gt; Dict)</span>
gDict = json.loads(gStr)
<span class="hljs-built_in">print</span>(gDict[<span class="hljs-string">&#x27;eng&#x27;</span>])  <span class="hljs-comment"># 60</span>

<span class="hljs-comment"># 2. 輸出 (Dict -&gt; JSON)</span>
json_output = json.dumps(gDict)
</code></pre>

<h2 id="ccq-5---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 5 - 答案與解析</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-1"><strong>正確答案：C.</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>dict.get(key, default)</code> 是安全的查詢方法。若指定的 <code>key</code> 存在於字典中，則回傳其對應的值；若 <code>key</code> 不存在，則回傳所設定的 <code>default</code> 值。</li>
<li data-marpit-fragment="3"><code>info.get('score', 60)</code>：由於 <code>'score'</code> 不在 <code>info</code> 中，因此回傳設定的預設值 <code>60</code>。</li>
<li data-marpit-fragment="4"><code>info.get('age', 60)</code>：由於 <code>'age'</code> 存在於 <code>info</code> 中，值為 <code>20</code>，因此直接回傳其原值 <code>20</code>。</li>
<li data-marpit-fragment="5">故結果為 <code>60 20</code>。</li>
</ul>
</div>

</div>
</li>
