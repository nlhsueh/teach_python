</code></pre>

<p>[!WARNING]<br />

<h2 id="312-else-%E9%9B%99%E5%90%91%E5%88%86%E6%94%AF">3.1.2 else 雙向分支</h2>
<ul>
<li data-marpit-fragment="1">當 <code>if</code> 條件<strong>不滿足</strong>時，會執行 <code>else</code> 區塊：</li>
</ul>
<pre><code class="language-python">g = <span class="hljs-number">50</span>
<span class="hljs-keyword">if</span> g &gt;= <span class="hljs-number">60</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;pass&quot;</span>)
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;good&quot;</span>)
<span class="hljs-keyword">else</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;fail&quot;</span>)    
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;not good&quot;</span>)
<span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;end&quot;</span>)
</code></pre>
<blockquote>
<p>[!WARNING]</p>
<ul>
<li data-marpit-fragment="2"><code>else</code> 絕對不能單獨出現，它必須緊跟在 <code>if</code> 或 <code>elif</code> 結構之後。</li>
<li data-marpit-fragment="3"><code>else</code> 後面也必須加上冒號 <code>:</code> 且不帶任何條件判斷。</li>
</ul>
</blockquote>

<h2 id="313-elif-%E5%A4%9A%E9%87%8D%E5%88%86%E6%94%AF">3.1.3 elif 多重分支</h2>
<ul>
<li data-marpit-fragment="1">用於排他的多重條件篩選（<code>elif</code> 等同於 <code>else if</code>）：</li>
</ul>
<pre><code class="language-python">g = <span class="hljs-number">50</span>
<span class="hljs-keyword">if</span> g &gt;= <span class="hljs-number">60</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;pass&quot;</span>)
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;good&quot;</span>)
<span class="hljs-keyword">elif</span> g &gt;= <span class="hljs-number">50</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;almost pass&quot;</span>)    
<span class="hljs-keyword">else</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;fail&quot;</span>)    
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;not good&quot;</span>)
<span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;end&quot;</span>)
</code></pre>
<ul>
<li data-marpit-fragment="2">程式會由上而下依序檢查條件，一旦某個條件成立，執行完該區塊後即跳出整個 <code>if-elif-else</code> 結構，不再檢查後續條件。</li>
</ul>

<ul>

<pre><code class="language-python">g = <span class="hljs-number">70</span>
<span class="hljs-keyword">if</span> g &gt;= <span class="hljs-number">60</span>:

<span class="hljs-keyword">elif</span> g &gt;= <span class="hljs-number">50</span>:

<h2 id="321-while-%E8%BF%B4%E5%9C%88">3.2.1 while 迴圈</h2>
<ul>
<li data-marpit-fragment="1">當條件成立時，重複執行區塊；條件不滿足時退出：</li>
</ul>
<pre><code class="language-python"><span class="hljs-built_in">sum</span> = <span class="hljs-number">0</span>
x = <span class="hljs-number">1</span>
<span class="hljs-keyword">while</span> x &lt;= <span class="hljs-number">100</span>:
    <span class="hljs-built_in">sum</span> = <span class="hljs-built_in">sum</span> + x
    x = x + <span class="hljs-number">1</span> <span class="hljs-comment"># <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> 迴圈控制變數遞增，確保條件最終能不成立</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;1到100的總和為:&quot;</span>, <span class="hljs-built_in">sum</span>) <span class="hljs-comment"># 5050</span>
</code></pre>
<blockquote>
<p>[!WARNING]<br />
<strong>防範無窮迴圈 (Infinite Loop)：</strong><br />
若遺漏了 <code>x = x + 1</code>，<code>x</code> 的值會永遠保持 <code>1</code>，使得 <code>x &lt;= 100</code> 永遠為 <code>True</code>，程式將無限執行導致當機。</p>
</blockquote>

<pre><code class="language-python"><span class="hljs-comment"># 未使用 list：變數零散，難以擴充與維護</span>
x1, x2, x3, x4 = <span class="hljs-number">20</span>, <span class="hljs-number">30</span>, <span class="hljs-number">90</span>, <span class="hljs-number">90</span>
<span class="hljs-built_in">sum</span> = x1 + x2 + x3 + x4

<span class="hljs-comment"># 使用 list 與 for 迴圈走訪：程式碼極具彈性</span>
grades = [<span class="hljs-number">20</span>, <span class="hljs-number">30</span>, <span class="hljs-number">90</span>, <span class="hljs-number">90</span>]
<span class="hljs-built_in">sum</span> = <span class="hljs-number">0</span>
<span class="hljs-keyword">for</span> g <span class="hljs-keyword">in</span> grades:
    <span class="hljs-built_in">sum</span> += g <span class="hljs-comment"># g 會依序取得 list 中的 20, 30, 90, 90</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;總和為:&#x27;</span>, <span class="hljs-built_in">sum</span>)
</code></pre>

<h2 id="325-break-%E8%88%87-continue-%E6%8E%A7%E5%88%B6">3.2.5 break 與 continue 控制</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>break</code></strong>：直接跳出當前所在的迴圈。</li>
<li data-marpit-fragment="2"><strong><code>continue</code></strong>：跳過本次迴圈剩餘的程式碼，直接進入下一次迭代。</li>
</ul>
<pre><code class="language-python"><span class="hljs-comment"># 1. 尋找第一個可以整除 7 的數字後退出</span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">1</span>, <span class="hljs-number">100</span>):
    <span class="hljs-keyword">if</span> i % <span class="hljs-number">7</span> == <span class="hljs-number">0</span>:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Found:&quot;</span>, i)
        <span class="hljs-keyword">break</span> <span class="hljs-comment"># 跳出整個 for 迴圈</span>

<span class="hljs-comment"># 2. 僅加總奇數，遇到偶數跳過</span>
<span class="hljs-built_in">sum</span> = <span class="hljs-number">0</span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">1</span>, <span class="hljs-number">10</span>):
    <span class="hljs-keyword">if</span> i % <span class="hljs-number">2</span> == <span class="hljs-number">0</span>:
        <span class="hljs-keyword">continue</span> <span class="hljs-comment"># 跳過下方的累加，進入下一個 i</span>
    <span class="hljs-built_in">sum</span> += i
</code></pre>

<h2 id="325-%E7%89%B9%E6%AE%8A%E8%AA%9E%E6%B3%95for--else-%E7%B5%90%E6%A7%8B">3.2.5 特殊語法：for ... else 結構</h2>

<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">2</span>, v):
    <span class="hljs-keyword">if</span> v % i == <span class="hljs-number">0</span>:
        <span class="hljs-built_in">print</span>(v, <span class="hljs-string">&quot;不是質數&quot;</span>)
        <span class="hljs-keyword">break</span>
<span class="hljs-keyword">else</span>:
    <span class="hljs-comment"># 只有當迴圈完整跑完 2 到 v-1，都沒有觸發 break 時才會執行</span>

</code></pre>

<h2 id="331-%E9%9F%93%E4%BF%A1%E9%BB%9E%E5%85%B5">3.3.1 韓信點兵</h2>
<blockquote>
<p>「兵不知其數，三三數之剩二，五五數之剩三，七七數之剩二，問兵幾何？」</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><strong>程式解法</strong>：讓數字 <code>n</code> 從 1 開始遞增，利用迴圈配合餘數運算 <code>%</code> 尋找符合三個條件的最小值：</li>
</ul>
<pre><code class="language-python">n = <span class="hljs-number">1</span>
<span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
    c1 = (n % <span class="hljs-number">3</span> == <span class="hljs-number">2</span>)
    c2 = (n % <span class="hljs-number">5</span> == <span class="hljs-number">3</span>)
    c3 = (n % <span class="hljs-number">7</span> == <span class="hljs-number">2</span>)
    <span class="hljs-keyword">if</span> c1 <span class="hljs-keyword">and</span> c2 <span class="hljs-keyword">and</span> c3:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;兵數最少為:&quot;</span>, n)
        <span class="hljs-keyword">break</span> <span class="hljs-comment"># 找到符合的最小值，退出</span>
    n += <span class="hljs-number">1</span>
<span class="hljs-comment"># 輸出: 兵數最少為: 23</span>
</code></pre>

        <span class="hljs-keyword">continue</span>
    guess = <span class="hljs-built_in">int</span>(guess)
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> (<span class="hljs-number">1</span> &lt;= guess &lt;= <span class="hljs-number">100</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;<img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> 範圍錯誤：必須介於 1 到 100 之間！&quot;</span>)
        <span class="hljs-keyword">continue</span>
    <span class="hljs-keyword">if</span> guess == target:

<h2 id="concept-check-question-ccq-1">Concept Check Question (CCQ 1)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>下列程式執行後，何者正確？</strong></p>
<pre><code class="language-python">g = <span class="hljs-number">98</span>
<span class="hljs-keyword">if</span> g &gt; <span class="hljs-number">90</span>:
   <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;Class A&quot;</span>, end=<span class="hljs-string">&#x27; &#x27;</span>) 
<span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;Good job&quot;</span>, end=<span class="hljs-string">&#x27; &#x27;</span>)
<span class="hljs-keyword">elif</span> (g &gt; <span class="hljs-number">80</span>):
   <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;Class B&quot;</span>, end=<span class="hljs-string">&#x27; &#x27;</span>) 
</code></pre>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 因為內縮與語法結構問題，會引發語法錯誤。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 當 <code>g</code> 改為 70 時，會印出 <code>Class A Good Job</code>。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 當 <code>g</code> 為 98 時，印出 <code>Class B</code>。</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 當 <code>g</code> 為 98 時，印出 <code>Good job Class B</code>。</p>
</div>

</div>
</li>
</ul>

<h2 id="concept-check-question-ccq-2">Concept Check Question (CCQ 2)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>針對以下程式，哪兩個選項正確？</strong></p>
<pre><code class="language-python"><span class="hljs-keyword">if</span> g &gt;= <span class="hljs-number">60</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;pass&quot;</span>, end=<span class="hljs-string">&quot;; &quot;</span>)
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;good&quot;</span>, end=<span class="hljs-string">&quot;; &quot;</span>)
<span class="hljs-keyword">elif</span> g &gt;= <span class="hljs-number">50</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;almost pass&quot;</span>, end=<span class="hljs-string">&quot;; &quot;</span>)    
    <span class="hljs-keyword">if</span> (g &gt;= <span class="hljs-number">90</span>):
        <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;excellent&quot;</span>, end=<span class="hljs-string">&quot;; &quot;</span>)    
<span class="hljs-keyword">else</span>:
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;fail&quot;</span>, end=<span class="hljs-string">&quot;; &quot;</span>)    
    <span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;not good&quot;</span>, end=<span class="hljs-string">&quot;; &quot;</span>)    
<span class="hljs-built_in">print</span> (<span class="hljs-string">&quot;end of report&quot;</span>)
</code></pre>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 當 <code>g</code> 為 0 時，印出 <code>fail; not good; end of report</code>。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 當 <code>g</code> 為 60 時，僅印出 <code>pass; good;</code>。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 當 <code>g</code> 為 90 時，會印出 <code>excellent; end of report</code>。</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 當 <code>g</code> 為 51 時，印出 <code>almost pass; end of report</code>。</p>
</div>

</div>
</li>
</ul>

<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>

<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>

</ul>

<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>關於下列尋找質數的程式，哪兩個選項正確？</strong></p>
<pre><code class="language-python"><span class="hljs-keyword">for</span> v <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">2</span>, <span class="hljs-number">11</span>):
    <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span> (<span class="hljs-number">2</span>, v):
        <span class="hljs-keyword">if</span> v % i == <span class="hljs-number">0</span>:
            <span class="hljs-built_in">print</span> (v, <span class="hljs-string">&#x27;不是質數&#x27;</span>)
            <span class="hljs-keyword">break</span>	
    <span class="hljs-keyword">else</span>:
        <span class="hljs-built_in">print</span> (v, <span class="hljs-string">&#x27;是質數&#x27;</span>)
</code></pre>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 執行輸出中會包含 <code>11是質數</code>。</p>
</li>
<li data-marpit-fragment="2">

</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 輸出包含 <code>7是質數</code>。</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 輸出包含 <code>6不是質數</code>。</p>
</div>

<h2 id="ccq-7---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 7 - 答案與解析</h2>
<div class="ccq-columns">

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-%E5%92%8C-d"><strong>正確答案：C 和 D</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">這是 Python 合法的 <code>for-else</code> 語法。當內層 <code>for</code> 迴圈跑完且<strong>未被 break 中斷</strong>時，執行 <code>else</code>。</li>
<li data-marpit-fragment="3"><code>range(2, 11)</code> 生成數字 2 至 10 (不含 11)，故不可能印出 11。</li>

<ul>
<li data-marpit-fragment="2"><code>range(1, 10, 2)</code> 生成序列為 <code>[1, 3, 5, 7, 9]</code>。</li>
<li data-marpit-fragment="3"><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="4.929ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2178.6 748"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(622.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1678.6,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container>：<code>sum = 0 + 1 = 1</code>。</li>
<li data-marpit-fragment="4"><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="4.929ex" height="1.69ex" role="img" focusable="false" viewBox="0 -665 2178.6 747"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(622.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1678.6,0)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></svg></mjx-container>：<code>sum = 1 + 3 = 4</code>。</li>

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88a-%E5%92%8C-c"><strong>正確答案：A 和 C</strong></h3>

<li data-marpit-fragment="1">

<ul>
<li data-marpit-fragment="2">中斷點是開發工具偵錯（Debugger）的一種機制，讓程式執行到該行時暫停，方便工程師檢視當前變數的值、記憶體與呼叫堆疊以找出問題所在 (A, C 正確)。</li>
<li data-marpit-fragment="3">中斷點不是 Python 的語法指令，因此無法用來跳出迴圈，也不會改變程式的執行效率。</li>
</ul>

<div class="ccq-columns">

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88d-%E7%84%A1%E7%AA%AE%E8%BF%B4%E5%9C%88%E7%84%A1%E9%99%90%E5%8D%B0%E5%87%BA"><strong>正確答案：D. 無窮迴圈（無限印出）</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>n</code> 的初始值為 <code>1</code>，每次迴圈遞增 <code>2</code>。</li>
<li data-marpit-fragment="3"><code>n</code> 的值序列為 <code>1, 3, 5, 7, ..., 97, 99, 101, ...</code>。</li>
<li data-marpit-fragment="4">因為 <code>n</code> 永遠是奇數，所以 <code>n == 100</code> 的判斷條件永遠不會成立，<code>break</code> 不會被觸發，造成無窮迴圈。</li>
</ul>

<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">第一次迴圈讀入 <code>100</code>，<code>sum = 0 + 100 = 100</code>。</li>

<li data-marpit-fragment="4">第三次迴圈讀入 <code>-999</code>，<code>sum = 198 + (-999) = -801</code>。</li>

</ul>

<h2 id="ccq-13---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 13 - 答案與解析</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88a-b-%E5%92%8C-c"><strong>正確答案：A, B 和 C</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">Python 的 <code>random.randint(a, b)</code> 會回傳一個在 <code>[a, b]</code> 閉區間內的隨機整數。</li>

 336 83 348Q84 359 96 365Q104 369 382 500T665 634Q669 636 674 636ZM84 -118Q84 -108 99 -98H678Q694 -104 694 -118Q694 -130 679 -138H98Q84 -131 84 -118Z"></path></g><g data-mml-node="mn" transform="translate(3739.1,0)"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container>，因此 4、10 和 50 都是合法可能的值。</li>
