<li data-marpit-fragment="3"><strong>簡單優於複雜</strong> (<em>Simple is better than complex.</em>)</li>
<li data-marpit-fragment="4"><strong>可讀性很重要</strong> (<em>Readability counts.</em>)</li>
</ul>

<ul>
<li data-marpit-fragment="1"><strong>2008 年 (Python 3.0 問世)</strong>：架構重大重構，不向下相容。為了解決 Unicode 編碼與語法包袱。Python 2 已於 2020 年正式除役 (EOL)。</li>
<li data-marpit-fragment="2"><strong>3.x 關鍵里程碑</strong>：
<ul>
<li data-marpit-fragment="3"><strong>3.6</strong>：引入 <code>f-string</code> 格式化字串。</li>
<li data-marpit-fragment="4"><strong>3.10</strong>：引入 <code>match-case</code> 結構化模式匹配與語法錯誤提示優化。</li>
<li data-marpit-fragment="5"><strong>3.11</strong>：解譯器重構，速度效能大躍進 10%～60%。</li>
<li data-marpit-fragment="6"><strong>3.12 / 3.13+</strong>：現代主流，朝向多執行緒效能優化與型別系統強化。</li>
</ul>
</li>
</ul>

<h2 id="132-%E7%8F%BE%E4%BB%A3-python-%E9%96%8B%E7%99%BC%E5%B7%A5%E5%85%B7%E7%B8%BD%E8%A6%BD">1.3.2 現代 Python 開發工具總覽</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. 線上雲端環境 (Cloud / Web)</strong>：
<ul>
<li data-marpit-fragment="2"><strong>Google Colab</strong>：免費雲端 Jupyter Notebook，具備「零安裝」、「免摩擦起步」、「免費 GPU 算力」及 Gemini AI 輔助。</li>
<li data-marpit-fragment="3"><strong>Jupyter Notebook</strong>：以網頁為基礎的互動式運算與數據分析環境。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>2. 本機專業環境 (Local IDE / Editor)</strong>：
<ul>
<li data-marpit-fragment="5"><strong>VS Code</strong>：微軟開發的免費開源編輯器，擁有極強的擴充生態系。</li>
<li data-marpit-fragment="6"><strong>PyCharm</strong>：專業級 Python IDE，適合大型企業專案。</li>
<li data-marpit-fragment="7"><strong>IDLE</strong>：Python 官方安裝包內建的極簡環境。</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>3. AI 輔助開發工具 (AI-Powered Tools)</strong>：
<ul>
<li data-marpit-fragment="9"><strong>GitHub Copilot</strong>：AI 程式碼補全。</li>
<li data-marpit-fragment="10"><strong>Cursor</strong>：AI 原生編輯器，支援全專案重構與生成。</li>
</ul>
</li>
</ul>

<h2 id="15-%E6%99%BA%E6%85%A7%E5%AD%B8%E7%BF%92%E7%92%B0%E5%A2%83smart-coding-tutor">1.5 智慧學習環境：Smart Coding Tutor</h2>
<p>我們結合了 <strong>OJ (線上解題系統)</strong> 與 <strong>AI 智慧導師</strong>，打造個人化的程式學習路徑：</p>
<ul>
<li data-marpit-fragment="1"><strong>線上解題系統 (OJ)</strong>：
<ul>
<li data-marpit-fragment="2">給予明確目標，提交後在數秒內給予即時、客觀的回饋 (<code>Accepted</code>, <code>Wrong Answer</code> 等)。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>AI 智慧提示 (不再卡關)</strong>：
<ul>
<li data-marpit-fragment="4">當你提交錯誤時，AI 不會直接給出標準答案，而是分析邏輯盲點並給出提示。</li>
<li data-marpit-fragment="5">提供觀念補強與自適應學習路徑。</li>
</ul>
</li>
</ul>
